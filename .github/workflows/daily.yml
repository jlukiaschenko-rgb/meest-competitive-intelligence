name: Daily competitive scan and Pages
# Fresh workflow run avoids duplicate artifacts from re-runs.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily.yml'
      - 'scripts/**'
      - 'config/**'
      - 'index.html'
      - 'data/daily_reports.json'
      - 'data/analysis.json'
  schedule:
    - cron: '12 6 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: intelligence-pages
  cancel-in-progress: false
jobs:
  scan:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Monitor competitors
        run: python scripts/scan.py
      - name: Save scan history with rebase retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/history.json data/state.json
          if git diff --cached --quiet; then
            echo "No new scan data"
            exit 0
          fi
          git commit -m "data: daily competitor monitoring"
          for n in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          echo "Could not persist scan history" >&2
          exit 1
  deploy:
    needs: [scan]
    if: always() && (needs.scan.result == 'success' || needs.scan.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Use latest published data
        run: |
          git fetch origin main
          git checkout --detach origin/main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
        id: deployment
